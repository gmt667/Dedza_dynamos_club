    <div class="sidebar-footer">
      <span class="sidebar-user" id="sidebar-user">–</span>
      <a href="http://127.0.0.1:4173/" target="_blank" class="view-site-btn">View Public Site ↗</a>
      <button id="logout-btn" class="logout-btn">Sign out</button>
    </div>
  </aside>
  <div class="admin-main" id="admin-main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
      <div class="topbar-title"><h1>News &amp; Stories</h1><span class="topbar-sub">Manage all published club content</span></div>
      <div class="topbar-actions">
        <button class="btn-primary" id="new-story-btn" style="display:inline-flex;align-items:center;gap:.4rem">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New story
        </button>
        <div class="topbar-avatar" id="topbar-avatar">A</div>
      </div>
    </header>
    <div class="admin-content">

      <!-- EDITOR MODAL -->
      <div class="modal-overlay" id="story-modal" hidden style="display:none">
        <div class="modal-card">
          <div class="modal-head">
            <h2 id="modal-title">New story</h2>
            <button class="modal-close" id="modal-close" aria-label="Close dialog">✕</button>
          </div>
          <form id="story-form" class="story-form">
            <div class="form-row">
              <div class="form-field">
                <label for="s-title">Headline</label>
                <input id="s-title" type="text" placeholder="e.g. Dedza Dynamos sign new striker">
              </div>
              <div class="form-field form-field--sm">
                <label for="s-tag">Category</label>
                <select id="s-tag">
                  <option>News</option>
                  <option>Match report</option>
                  <option>Club</option>
                  <option>History</option>
                  <option>Commercial</option>
                </select>
              </div>
            </div>
            <div class="form-field">
              <label for="s-lead">Lead paragraph</label>
              <textarea id="s-lead" rows="3" placeholder="Opening paragraph shown in article cards..."></textarea>
            </div>
            <div class="form-field">
              <label for="s-body">Body content</label>
              <textarea id="s-body" rows="8" placeholder="Full article text..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="s-date">Publish date</label>
                <input id="s-date" type="date">
              </div>
              <div class="form-field">
                <label for="s-status">Status</label>
                <select id="s-status"><option>Draft</option><option>Published</option></select>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-ghost" id="modal-cancel">Cancel</button>
              <button type="submit" class="btn-primary">Save story</button>
            </div>
          </form>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filter-bar">
        <input type="search" placeholder="Search stories..." id="story-search" class="filter-input">
        <select class="filter-select" id="story-filter-status">
          <option value="all">All status</option>
          <option value="Published">Published</option>
          <option value="Draft">Draft</option>
        </select>
        <select class="filter-select" id="story-filter-tag">
          <option value="all">All categories</option>
          <option>News</option>
          <option>Match report</option>
          <option>Club</option>
          <option>History</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="dash-panel">
        <div class="table-wrap">
          <table class="admin-table" id="news-table">
            <thead>
              <tr>
                <th>Headline</th>
                <th>Category</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="news-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-toast" id="admin-toast"></div>
  <script src="/admin-api.js"></script>
  <script src="/admin-app.js"></script>
  <script src="/admin-news.js"></script>
</body>
</html>
