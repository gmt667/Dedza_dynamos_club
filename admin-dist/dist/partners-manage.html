  <div class="admin-main" id="admin-main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
      <div class="topbar-title"><h1>Partners &amp; Sponsors</h1><span class="topbar-sub">Manage club partnerships &amp; sponsor links</span></div>
      <div class="topbar-actions">
        <button class="btn-primary" id="add-partner-btn" style="display:inline-flex;align-items:center;gap:.4rem">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add partner
        </button>
        <div class="topbar-avatar" id="topbar-avatar">A</div>
      </div>
    </header>
    <div class="admin-content">

      <!-- MODAL -->
      <div class="modal-overlay" id="partner-modal" hidden style="display:none">
        <div class="modal-card">
          <div class="modal-head">
            <h2>Add partner</h2>
            <button class="modal-close" id="partner-modal-close">✕</button>
          </div>
          <form class="story-form" id="partner-form">
            <div class="form-field">
              <label>Partner name</label>
              <input type="text" id="pt-name" placeholder="e.g. Goshen City">
            </div>
            <div class="form-field">
              <label>Tier / Package</label>
              <select id="pt-tier">
                <option>Principal Partner (Headline)</option>
                <option>Official Kit Partner</option>
                <option>Matchday Partner</option>
                <option>Community Sponsor</option>
              </select>
            </div>
            <div class="form-field">
              <label>Website URL</label>
              <input type="url" id="pt-url" placeholder="https://...">
            </div>
            <div class="form-actions">
              <button type="button" class="btn-ghost" id="partner-modal-cancel">Cancel</button>
              <button type="submit" class="btn-primary">Save partner</button>
            </div>
          </form>
        </div>
      </div>

      <div class="dash-panel">
        <div class="panel-head">
          <h2>Active partners</h2>
          <span class="badge-pill">Live from SQLite</span>
        </div>
        <div id="partners-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem">
          <!-- Loaded dynamically from SQLite -->
        </div>
      </div>

    </div>
  </div>
  <div class="admin-toast" id="admin-toast"></div>
  <script src="/admin-api.js"></script>
  <script src="/admin-app.js"></script>
  <script>
    const pModal = document.getElementById('partner-modal');
    const pGrid = document.getElementById('partners-grid');

    async function loadPartners() {
      if (!pGrid) return;
      try {
        const partners = await window.AdminAPI.getPartners();
        if (!partners.length) {
          pGrid.innerHTML = '<p style="color:#888;padding:1rem 0">No partners registered in database.</p>';
          return;
        }
        pGrid.innerHTML = partners.map(p => `
          <div class="player-admin-card" style="border-top-color:var(--yellow)">
            <strong>${p.name}</strong>
            <p style="font-size:.78rem;color:#666">${p.category}</p>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem">
              <span class="badge published">${p.status || 'Active'}</span>
              <button class="tbl-btn danger" style="padding:.2rem .5rem;font-size:.7rem" onclick="deletePartnerItem('${p.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.warn('Error loading partners:', err);
      }
    }

    window.deletePartnerItem = async function(id) {
      if (!confirm('Remove this partner?')) return;
      try {
        await window.AdminAPI.deletePartner(id);
        adminToast('Partner removed ✓');
        loadPartners();
      } catch (err) {
        adminToast('Error removing partner: ' + err.message);
      }
    };

    document.getElementById('add-partner-btn')?.addEventListener('click', () => {
      document.getElementById('pt-name').value = '';
      document.getElementById('pt-cat').value = '';
      document.getElementById('pt-url').value = '';
      pModal.classList.add('is-open'); pModal.hidden = false; pModal.style.display = 'flex';
    });
    document.getElementById('partner-modal-close')?.addEventListener('click', () => {
      pModal.classList.remove('is-open'); pModal.hidden = true; pModal.style.display = 'none';
    });
    document.getElementById('partner-modal-cancel')?.addEventListener('click', () => {
      pModal.classList.remove('is-open'); pModal.hidden = true; pModal.style.display = 'none';
    });
    document.getElementById('partner-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('pt-name').value.trim();
      const category = document.getElementById('pt-cat').value.trim();
      const tier = document.getElementById('pt-tier')?.value || 'Commercial';
      const url = document.getElementById('pt-url')?.value.trim() || '';

      if (!name || !category) {
        adminToast('Please provide partner name and role');
        return;
      }

      try {
        await window.AdminAPI.createPartner({ name, category, tier, status: 'Active', url });
        pModal.classList.remove('is-open'); pModal.hidden = true; pModal.style.display = 'none';
        adminToast('Partner saved to Database ✓');
        loadPartners();
      } catch (err) {
        adminToast('Error saving partner: ' + err.message);
      }
    });

    loadPartners();
  </script>
</body>
