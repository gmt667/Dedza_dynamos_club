<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login · Dedza Dynamos</title>
  <link rel="icon" href="/assets/brand/dedza-dynamos-crest.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
  <meta name="robots" content="noindex,nofollow">
</head>
<body class="login-page">
  <div class="login-bg">
    <div class="login-orb login-orb--1"></div>
    <div class="login-orb login-orb--2"></div>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="/assets/brand/dedza-dynamos-crest.png" alt="Dedza Dynamos crest" class="login-crest">
        <div>
          <strong>Dedza Dynamos</strong>
          <small>Club Administration</small>
        </div>
      </div>
      <h1 class="login-title">Staff Login</h1>
      <p class="login-sub">Restricted to authorised club staff only.</p>
      <form id="login-form" class="login-form" novalidate>
        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" id="toggle-pw" aria-label="Show password" style="display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" class="login-btn" id="login-submit">
          <span id="login-btn-text">Sign in</span>
          <span id="login-spinner" class="spinner" hidden></span>
        </button>
      </form>
      <p class="login-notice" style="display:flex;align-items:center;justify-content:center;gap:.35rem">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        This area is not linked from the public site.
      </p>
    </div>
  </div>
  <script src="/admin-auth.js"></script>
</body>
</html>
